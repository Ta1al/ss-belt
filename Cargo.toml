[package]
name = "ss-belt"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "One toolbelt for Linux capture, annotate, record, OCR, QR and upload"
license = "MIT OR Apache-2.0"
readme = "README.md"
categories = ["command-line-utilities", "multimedia::video", "multimedia::images"]
keywords = ["screenshot", "wayland", "capture", "ocr", "qr"]

[[bin]]
name = "ss-belt"
path = "src/main.rs"

[lib]
name = "ss_belt"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
directories = "6"
hex = "0.4"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
qrcode = { version = "0.14", features = ["image"] }
rqrr = "0.10"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
x11rb = "0.13"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = "thin"
strip = true
